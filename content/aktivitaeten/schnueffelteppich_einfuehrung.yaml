id: schnueffelteppich_einfuehrung
titel: Schnüffelteppich, erste Runde
satz: >
  Futter im Teppich verstecken und suchen lassen — zehn Minuten Nase
  kosten mehr Kraft als eine halbe Stunde Laufen.
typ: beschaeftigung
trainiert_skill: null

bedarf:
  koerperlich: 1
  kopfarbeit: 3
  nase: 3
  sozial: 0
  erholung: 1
belastung: 1

dauer_min: 5
dauer_max: 15
ort: drinnen
ist_auffrischung: false

hitzetauglich: true
regentauglich: true
dunkeltauglich: true
gelenkbelastend: false
saisonfenster: null

equipment: []
zweite_person: false
min_alter_wochen: 8
max_alter_wochen: null
eignung:
  jagd: 1
  huete: 1

varianzgruppe: nasenarbeit_drinnen
sperrfrist_tage: 10

illustration: schnueffelteppich
anleitung:
  - Ein Handtuch locker zusammenlegen, sodass Falten entstehen.
  - Eine Handvoll Trockenfutter in die Falten streuen, anfangs gut sichtbar.
  - Den Hund suchen lassen, ohne ihn zu lenken oder anzufeuern.
  - Wenn er sicher sucht, das Futter tiefer verstecken.
erfolgskriterium: >
  Er sucht selbstständig weiter, ohne zwischendurch zu dir zu schauen.
haeufige_fehler:
  - Zu früh zu schwer versteckt — dann gibt er auf, statt zu lernen.
  - Mithelfen und zeigen. Die Arbeit soll die Nase machen, nicht du.
troubleshooting:
  - problem: Er verliert nach dreißig Sekunden das Interesse.
    antwort: >
      Wahrscheinlich zu schwer oder zu satt. Nimm hochwertigeres Futter,
      leg es sichtbar obenauf und mach früher Schluss, als er aufhören würde.
  - problem: Er zerrt am Handtuch statt zu suchen.
    antwort: >
      Ganz normal am Anfang. Halte den Teppich anfangs mit einer Hand fest
      und belohne jedes Schnüffeln sofort.
