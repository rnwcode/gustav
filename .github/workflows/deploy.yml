# Deployment — Platzhalter, aktiv ab Phase 3.
#
# Gedachter Ablauf:
#   1. supabase link auf das Staging-Projekt, db push, Smoke-Test
#   2. tool/seed.dart für den Content
#   3. nach manueller Freigabe dasselbe gegen Produktion
#
# Zugangsdaten aus den Repository-Secrets: SUPABASE_ACCESS_TOKEN,
# STAGING_PROJECT_REF, PROD_PROJECT_REF.
#
# Die Produktion wird nie ohne vorherigen Staging-Durchlauf angefasst.
# Und vor dem ersten echten Deployment steht der Restore-Test — auch bei
# gehostetem Supabase: Der Anbieter sichert, aber ob du wieder hochkommst,
# weiß nur, wer es einmal gemacht hat.

name: Deploy

on:
  workflow_dispatch:

jobs:
  platzhalter:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ab Phase 3 — siehe docs/bauplan.md"
